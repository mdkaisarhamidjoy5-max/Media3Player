name: Build AIX Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Download Extension Template & Build
        run: |
          git clone https://github.com/mit-c開幕/appinventor-sources.git appinventor
          mkdir -p appinventor/appinventor/components/src/com/yourname/media3player
          cp src/com/yourname/media3player/Media3Player.java appinventor/appinventor/components/src/com/yourname/media3player/
          cd appinventor/appinventor
          ant extensions

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Media3Player-AIX
          path: appinventor/appinventor/build/components/build/extensions/*.aix
